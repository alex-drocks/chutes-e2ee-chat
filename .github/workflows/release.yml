name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to apply when no explicit version is provided."
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact version to publish or rebuild, without the leading v. Leave blank to create the next version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.8.1'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          function Assert-SemVer([string] $Version) {
            if ($Version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Version '$Version' must use MAJOR.MINOR.PATCH format."
            }
          }

          function Test-GitRef([string] $Ref) {
            $previousNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
            $PSNativeCommandUseErrorActionPreference = $false
            try {
              git rev-parse -q --verify $Ref *> $null
              return $LASTEXITCODE -eq 0
            } finally {
              $PSNativeCommandUseErrorActionPreference = $previousNativeErrorPreference
              $global:LASTEXITCODE = 0
            }
          }

          git fetch --tags --force

          $eventName = "${{ github.event_name }}"
          $createTag = "false"

          if ($eventName -eq "push") {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Release tags must look like v0.1.0."
            }
            $version = $Matches[1]
          } else {
            $explicitVersion = "${{ github.event.inputs.version }}".Trim()
            if ($explicitVersion) {
              $version = $explicitVersion.TrimStart("v")
              Assert-SemVer $version
              $tag = "v$version"
              if (-not (Test-GitRef "refs/tags/$tag")) {
                $createTag = "true"
              }
            } else {
              $latest = $null
              $tags = git tag --list "v[0-9]*" --sort=-v:refname
              foreach ($candidate in $tags) {
                if ($candidate -match '^v(\d+)\.(\d+)\.(\d+)$') {
                  $latest = @{
                    major = [int] $Matches[1]
                    minor = [int] $Matches[2]
                    patch = [int] $Matches[3]
                  }
                  break
                }
              }

              if (-not $latest) {
                $packageJson = Get-Content -Raw package.json | ConvertFrom-Json
                if ($packageJson.version -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
                  throw "package.json version must use MAJOR.MINOR.PATCH format."
                }
                $latest = @{
                  major = [int] $Matches[1]
                  minor = [int] $Matches[2]
                  patch = [int] $Matches[3]
                }
              }

              switch ("${{ github.event.inputs.bump }}") {
                "major" {
                  $latest.major += 1
                  $latest.minor = 0
                  $latest.patch = 0
                }
                "minor" {
                  $latest.minor += 1
                  $latest.patch = 0
                }
                default {
                  $latest.patch += 1
                }
              }

              $version = "$($latest.major).$($latest.minor).$($latest.patch)"
              $tag = "v$version"
              if (Test-GitRef "refs/tags/$tag") {
                throw "Tag $tag already exists. Use the explicit version input to rebuild an existing release."
              }
              $createTag = "true"
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "create_tag=$createTag" >> $env:GITHUB_OUTPUT

      - name: Checkout existing release tag
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.create_tag == 'false'
        run: git checkout --force "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Unit tests
        run: bun run test:ci

      - name: Sync package versions for artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "const fs=require('fs'); const version=process.env.RELEASE_VERSION; for (const path of ['package.json','renderer/package.json']) { const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=version; fs.writeFileSync(path, JSON.stringify(pkg,null,2)+'\n'); }"

      - name: Build Windows executables
        run: bun run dist

      - name: List release files
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          if (-not (Get-ChildItem -Path release -Filter *.exe -File)) {
            throw "No Windows executable files were produced in release/."
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-release-${{ steps.version.outputs.tag }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

      - name: Create release tag
        if: steps.version.outputs.create_tag == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Ensure draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: Chutes E2EE Chat ${{ steps.version.outputs.tag }}
        run: |
          $previousNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            $existingRelease = gh release view $env:RELEASE_TAG --json isDraft 2>$null
            $releaseExists = $LASTEXITCODE -eq 0
          } finally {
            $PSNativeCommandUseErrorActionPreference = $previousNativeErrorPreference
            $global:LASTEXITCODE = 0
          }

          if ($releaseExists) {
            $release = $existingRelease | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release $env:RELEASE_TAG is already published. Immutable GitHub releases cannot accept new or replacement assets after publication, so rebuild the release under a new version."
            }
          } else {
            gh release create $env:RELEASE_TAG --draft --title $env:RELEASE_NAME --generate-notes
          }

      - name: Upload assets to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $assets = Get-ChildItem -Path release -File | Where-Object {
            $_.Extension -in @(".exe", ".blockmap") -or $_.Name -eq "latest.yml"
          } | Select-Object -ExpandProperty FullName

          if (-not $assets) {
            throw "No release assets were found to upload."
          }

          gh release upload $env:RELEASE_TAG $assets --clobber

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: Chutes E2EE Chat ${{ steps.version.outputs.tag }}
        run: |
          gh release edit $env:RELEASE_TAG --draft=false --title $env:RELEASE_NAME
